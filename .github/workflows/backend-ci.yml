name: Backend CI

on:
  push:
    branches: ["main", "master", "develop", "codex/**"]
  pull_request:
    branches: ["*"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall app main.py worker.py

      - name: Run unit and integration tests
        run: pytest -q

      - name: Run selector contract gate
        run: pytest -q -m contract tests/test_source_contracts.py
